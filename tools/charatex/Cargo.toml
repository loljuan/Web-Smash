[package]
name = "charatex"
version = "1.0.0"
edition = "2021"
description = "Convierte PNG <-> BNTX para los chara de Smash Ultimate"

[dependencies]
bntx = { git = "https://github.com/ScanMountGoat/bntx", rev = "87fffc7" }
image_dds = "0.7.0"
image = { version = "0.25.5", default-features = false, features = ["png"] }
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
